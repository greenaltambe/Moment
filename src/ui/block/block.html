<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Access Paused — Moment</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../icons/icon-16.png">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="block.css">
  <link rel="stylesheet" href="../expressive.css">
</head>
<body>
  <div class="block-card">
    <div class="brand-row">
      <img src="../../icons/icon-48.png" alt="" class="brand-icon" width="22" height="22" aria-hidden="true">
      <span class="brand-title">Moment</span>
    </div>

    <div class="card-body">
    <h1 class="headline">Access Paused</h1>
    <p class="subtitle" id="reasonDesc">This website is restricted according to your active boundaries.</p>

    <div class="meta-box">
      <div class="meta-item">
        <span class="meta-label">Restricted Target</span>
        <span class="meta-value" id="targetDisplay">example.com</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Collection</span>
        <span class="meta-value" id="collectionDisplay">Social Media</span>
      </div>
    </div>

    <!-- Daily budget extension (shown only when a daily limit is used up) -->
    <section id="extensionBox" class="extension-box is-hidden" aria-label="Need a little more time?">
      <p class="extension-title">Need a little more time?</p>
      <label for="extensionIntention" class="meta-label">What will you use it for?</label>
      <textarea id="extensionIntention" class="extension-input" rows="2" maxlength="280" placeholder="e.g. Reply to one message, then close it"></textarea>
      <button id="btnExtend" class="btn btn-secondary" disabled aria-disabled="true">Add 5 more minutes</button>
      <p id="extensionNote" class="extension-note"></p>
    </section>
    <div id="extensionStatus" class="extension-note" role="status" aria-live="polite"></div>

    </div>

    <div class="card-footer">
    <div class="actions">
      <button id="btnBack" class="btn btn-primary">Go Back</button>
      <button id="btnClose" class="btn btn-secondary">Close Tab</button>
    </div>
    </div>
  </div>
  <script type="module" src="block.js"></script>
</body>
</html>
